apiVersion: v1
kind: ConfigMap
metadata:
  name: cosmic-flight-sim-config
  namespace: cosmic-flight-sim
  labels:
    app: cosmic-flight-simulator
data:
  # MongoDB Configuration (non-sensitive)
  MONGODB_HOST: "mongodb-service"
  MONGODB_PORT: "27017"
  MONGODB_DATABASE: "cosmic_flight_sim"

  # API Configuration
  ACCESS_TOKEN_MIN: "60"

  # Application Settings
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
